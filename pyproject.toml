[project]
name = "a-stock-scanner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "akshare>=1.18.94",
    "duckdb>=1.5.5",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "streamlit>=1.63.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
